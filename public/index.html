<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Stager — тренажёр выступлений</title>
    <meta name="description" content="Выступи перед залом, который реагирует на твою речь: жюри задаёт вопросы голосом, ИИ разбирает питч. Бесплатно, на русском, английском и румынском." />
    <meta name="theme-color" content="#F7A61E" />
    <!-- Значок: цветок Stager на оранжевом. favicon.ico Expo собирает сам из assets/favicon.png (app.json → web.favicon) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Превью ссылки в соцсетях и мессенджерах: краулеры не выполняют JS, поэтому теги — прямо в HTML.
         Картинка — public/og.png (исходник tools/og/card.html) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Stager" />
    <meta property="og:url" content="https://stager.icu/" />
    <meta property="og:title" content="Stager — зал ждёт. Выходи на сцену" />
    <meta property="og:description" content="Тренажёр выступлений с живым залом: говоришь уверенно — у зрителей горят глаза, мямлишь — достают телефоны. Жюри задаёт вопросы голосом, ИИ разбирает каждое слово. Бесплатно." />
    <meta property="og:image" content="https://stager.icu/og.png" />
    <meta property="og:image:secure_url" content="https://stager.icu/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stager: нарисованный зал из десяти зрителей и кнопка «Начать тренировку»" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="ro_RO" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stager — зал ждёт. Выходи на сцену" />
    <meta name="twitter:description" content="Тренажёр выступлений с живым залом, жюри и разбором от ИИ. Бесплатно." />
    <meta name="twitter:image" content="https://stager.icu/og.png" />
    <link rel="canonical" href="https://stager.icu/" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
