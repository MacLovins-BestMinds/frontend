<!doctype html>
<!-- Карточка превью ссылки (og:image, 1200×630). Перерисовать: swift tools/og/render.swift tools/og/card.html public/og.png -->
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Shantell; src: url(../../node_modules/@expo-google-fonts/shantell-sans/800ExtraBold/ShantellSans_800ExtraBold.ttf); font-weight: 800; }
  @font-face { font-family: Rubik; src: url(../../node_modules/@expo-google-fonts/rubik/700Bold/Rubik_700Bold.ttf); font-weight: 700; }
  @font-face { font-family: Rubik; src: url(../../node_modules/@expo-google-fonts/rubik/600SemiBold/Rubik_600SemiBold.ttf); font-weight: 600; }
  :root { --orange: #F7A61E; --ray: #F9B947; --ink: #161418; --paper: #FFFDF2; --cream: #F9F7E1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--orange); }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: repeating-conic-gradient(from 0deg at 50% 118%, var(--orange) 0deg 6deg, var(--ray) 6deg 12deg); }
  /* ламбрекен сверху: чёрные фестоны с оранжевыми бусинами */
  .valance { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; }
  .valance span { flex: 1; height: 64px; background: var(--ink); border-radius: 0 0 50% 50% / 0 0 100% 100%; position: relative; }
  .valance span::after { content: ''; position: absolute; top: 9px; right: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); z-index: 2; }
  .valance span:last-child::after { display: none; }
  .row { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); width: 1060px; }
  .center { position: absolute; top: 92px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .tag { font: 700 22px Rubik, sans-serif; letter-spacing: 2.6px; text-transform: uppercase; color: var(--orange);
    background: var(--ink); padding: 9px 24px; border-radius: 999px; transform: rotate(-2deg); }
  h1 { font: 800 74px/1.05 Shantell, sans-serif; color: var(--ink); text-align: center; letter-spacing: -0.5px; }
  .ticket { display: flex; align-items: stretch; background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
    box-shadow: 7px 7px 0 var(--ink); transform: rotate(-1deg); }
  .ticket b { font: 700 30px Rubik, sans-serif; color: var(--ink); padding: 20px 34px; }
  .ticket i { font-style: normal; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 26px;
    border-left: 4px dashed var(--ink); }
  .ticket i small { font: 600 16px Rubik, sans-serif; letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink); }
  .ticket i strong { font: 800 26px Shantell, sans-serif; color: var(--ink); }
  .brand { position: absolute; left: 44px; top: 92px; display: flex; align-items: center; gap: 12px; font: 800 38px Shantell, sans-serif; color: var(--ink); }
  .url { position: absolute; right: 44px; top: 100px; font: 700 24px Rubik, sans-serif; color: var(--ink);
    background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; box-shadow: 4px 4px 0 var(--ink); }
  .bubble { position: absolute; font: 700 22px Rubik, sans-serif; color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
    border-radius: 18px; padding: 8px 16px; box-shadow: 4px 4px 0 var(--ink); }
  .bubble.dark { background: var(--ink); color: var(--paper); }
  .spark { position: absolute; }
</style>
</head>
<body>
<div class="card">
  <div class="valance"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 24 24"><g fill="#161418"><circle cx="12" cy="5.5" r="4.2"/><circle cx="18.2" cy="10" r="4.2"/><circle cx="15.8" cy="17.3" r="4.2"/><circle cx="8.2" cy="17.3" r="4.2"/><circle cx="5.8" cy="10" r="4.2"/></g><circle cx="12" cy="12" r="3.2" fill="#F7A61E"/></svg>
    Stager
  </div>
  <div class="url">stager.icu</div>

  <svg class="spark" style="left:150px;top:240px" width="44" height="44" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z" fill="#161418"/></svg>
  <svg class="spark" style="right:150px;top:226px" width="58" height="58" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z" fill="#161418"/></svg>
  <svg class="spark" style="right:236px;top:330px" width="40" height="40" viewBox="0 0 24 24"><g fill="#161418"><circle cx="12" cy="5.5" r="4.2"/><circle cx="18.2" cy="10" r="4.2"/><circle cx="15.8" cy="17.3" r="4.2"/><circle cx="8.2" cy="17.3" r="4.2"/><circle cx="5.8" cy="10" r="4.2"/></g><circle cx="12" cy="12" r="3.2" fill="#F7A61E"/></svg>

  <div class="center">
    <div class="tag">Тренажёр выступлений</div>
    <h1>Зал ждёт. Выходи на сцену.</h1>
    <div class="ticket"><b>Начать тренировку</b><i><small>вход</small><strong>бесплатно</strong></i></div>
  </div>

  <img class="row" src="../../assets/scene/row.webp" alt="">
  <div class="bubble" style="left:150px;bottom:226px;transform:rotate(-5deg)">мы ждём!</div>
  <div class="bubble dark" style="left:528px;bottom:214px;transform:rotate(3deg)">твой выход</div>
  <div class="bubble" style="right:150px;bottom:226px;transform:rotate(5deg)">давай!</div>
</div>
</body>
</html>
